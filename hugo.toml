# Base URL used when generating links to your pages.
baseURL = "https://egig.github.io/"

theme = "egig"

title = "egig.github.io"
author = "egig"
locale = "en-US"

# Generate a robots.txt for SEO.
enableRobotsTXT = true

# Generate "Bear Blog"-like URLs only
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[permalinks]
  blog = "/:slug/"
  tags = "/blog/:slug"

[params]
  description = "Personal notes on software engineering and other computer science things."
  favicon = "favicon.ico"
  enablePostNavigator = true
  hideMadeWithLine = true

[caches.images]
  dir = ":cacheDir/images"

[markup.highlight]
  style = "github"
  lineNos = false
  lineNumbersInTable = false
  codeFences = true

[markup.goldmark.renderer]
  # Posts carry raw HTML inherited from the Jekyll/kramdown source
  unsafe = true